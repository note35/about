<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kir Chou</title>
    <script type="text/javascript">
      // Get the current path from the URL
      var path = window.location.pathname;

      // Check if it's a sub-path and redirect to the root with a query param
      // The segment(1) will be your repo name, like "toys"
      var repoName = path.split('/')[1];
      var redirectUrl = '/' + repoName + '/?path=' + path.substring(1);
      
      // Store the redirect URL in session storage
      sessionStorage.redirect = redirectUrl;

      // Redirect to the base of the repository
      window.location.href = '/' + repoName;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
